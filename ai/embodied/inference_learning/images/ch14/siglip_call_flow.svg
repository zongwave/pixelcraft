<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="880" viewBox="0 0 1300 880" font-family="Helvetica, Arial, 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker><marker id="arrRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker><marker id="arrGreen" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1e8449"/></marker><marker id="arrBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6feb"/></marker></defs>
<rect x="0" y="0" width="1300" height="880" rx="8" fill="#fafafa" stroke="none" stroke-width="1.6"/>
<text x="650.0" y="36" font-size="22" font-weight="bold" fill="#222" text-anchor="middle">图 14-1 · SigLIP 视觉塔在 gr00t 中的调用链与 NPU 替换点（N1.5 实测 file:line）</text>
<text x="650.0" y="60" font-size="12.5" font-weight="normal" fill="#666" text-anchor="middle">左列 = 一次 get_action 的调用顺序（SigLIP 只跑一遍）；红框 = transformers_npu 在 T0 换掉的类 / 前向里改调的 kernel</text>
<rect x="50" y="84" width="660" height="74" rx="8" fill="#fff" stroke="#aaa" stroke-width="1.6"/>
<text x="380.0" y="110" font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">① 入口</text>
<text x="380.0" y="130" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">Gr00tN1Model.get_action  (gr00t_n1.py:172)</text>
<text x="380.0" y="147" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">obs：3 相机 224×224 + state + 语言指令</text>
<line x1="380.0" y1="144" x2="380.0" y2="160" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50" y="164" width="660" height="91" rx="8" fill="#fff" stroke="#aaa" stroke-width="1.6"/>
<text x="380.0" y="190" font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">② 数据变换</text>
<text x="380.0" y="210" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">collate_fn：图像 resize/normalize → pixel_values，</text>
<text x="380.0" y="227" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">文本 tokenize → input_ids（image_token=151669 占位）</text>
<text x="380.0" y="244" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">collate_fn 里加 eagle_ 前缀  (gr00t/model/transforms.py:55-83)</text>
<line x1="380.0" y1="241" x2="380.0" y2="257" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50" y="261" width="660" height="74" rx="8" fill="#eaf2fd" stroke="#1f6feb" stroke-width="1.6"/>
<text x="380.0" y="287" font-size="13.5" font-weight="bold" fill="#1f6feb" text-anchor="middle">③ EagleBackbone.forward_eagle</text>
<text x="380.0" y="307" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">剥 eagle_ 前缀 → self.eagle_model(**input)  (eagle_backbone.py:100-111)</text>
<text x="380.0" y="324" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">LM 已在 __init__ 裁到前 12 层（layers.pop :56-58，两个 select_layer 陷阱见 §3.3）</text>
<line x1="380.0" y1="321" x2="380.0" y2="337" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50" y="341" width="660" height="91" rx="8" fill="#fdf6e3" stroke="#b9770e" stroke-width="1.6"/>
<text x="380.0" y="367" font-size="13.5" font-weight="bold" fill="#b9770e" text-anchor="middle">④ extract_feature</text>
<text x="380.0" y="387" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">Eagle2_5_VLModel.forward → extract_feature(pixel_values)</text>
<text x="380.0" y="404" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">(modeling_eagle2_5_vl.py:237/:358 → 定义 :311-338)</text>
<text x="380.0" y="421" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">★ 这是 SigLIP 全仓库唯一调用点——一次 get_action 只跑 1 遍</text>
<line x1="380.0" y1="418" x2="380.0" y2="434" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50" y="438" width="660" height="91" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="380.0" y="464" font-size="13.5" font-weight="bold" fill="#c0392b" text-anchor="middle">⑤ SiglipVisionModel（本章主角）</text>
<text x="380.0" y="484" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">transformers 4.51.3 siglip/modeling_siglip.py（gr00t 零 class Siglip* 定义）</text>
<text x="380.0" y="501" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">patch conv(14×14/s14) → +可学习PE[256,1152] → 27×SiglipEncoderLayer</text>
<text x="380.0" y="518" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">→ post-LN → 每图 256 token ×1152（27层/16头/inter4304/无CLS）</text>
<line x1="380.0" y1="515" x2="380.0" y2="531" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50" y="535" width="660" height="91" rx="8" fill="#fff" stroke="#aaa" stroke-width="1.6"/>
<text x="380.0" y="561" font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">⑥ 回写 LLM 序列</text>
<text x="380.0" y="581" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">select_layer==-1 → last_hidden_state (modeling:312-322)</text>
<text x="380.0" y="598" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">mlp1: 1152→2048 (:334-338) → 按 image_token_index=151669</text>
<text x="380.0" y="615" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">原位替换进 LLM 输入序列 (:247)</text>
<line x1="380.0" y1="612" x2="380.0" y2="628" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50" y="632" width="660" height="91" rx="8" fill="#f4ecf7" stroke="#7d3c98" stroke-width="1.6"/>
<text x="380.0" y="658" font-size="13.5" font-weight="bold" fill="#7d3c98" text-anchor="middle">⑦ LM 出 backbone_features</text>
<text x="380.0" y="678" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">Qwen3 前 12 层 → output_hidden_states</text>
<text x="380.0" y="695" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">取 hidden_states[select_layer] → eagle_linear (:109-110)</text>
<text x="380.0" y="712" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">NPU：qwen3_attention_run_die×12 + mlp_swiglu×12（09 章，非本章）</text>
<line x1="380.0" y1="709" x2="380.0" y2="725" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50" y="729" width="660" height="74" rx="8" fill="#fff" stroke="#aaa" stroke-width="1.6"/>
<text x="380.0" y="755" font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">⑧ Action Head（06 章）</text>
<text x="380.0" y="775" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">FlowmatchingActionHead：DiT 去噪 4 步全部复用 ⑦ 的输出，</text>
<text x="380.0" y="792" font-size="12.5" font-weight="normal" fill="#444" text-anchor="middle">不再回视觉塔 —— 所以 SigLIP 每轮 infer 只出现 1 次</text>
<text x="1010.0" y="100" font-size="14.5" font-weight="bold" fill="#c0392b" text-anchor="middle">transformers_npu 的 SigLIP 接入（npu/siglip.py）</text>
<rect x="760" y="116" width="500" height="108" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1010.0" y="142" font-size="13.5" font-weight="bold" fill="#c0392b" text-anchor="middle">注入点：patch 类符号</text>
<text x="1010.0" y="162" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">T0 换类符号（必须早于 AutoModel.from_config，</text>
<text x="1010.0" y="179" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">  eagle_backbone.py:50-51）：</text>
<text x="1010.0" y="196" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">SiglipEncoderLayer → encoder_layer_forward_wrapper</text>
<text x="1010.0" y="213" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">SiglipMultiheadAttentionPoolingHead（npu_patch.install）</text>
<line x1="752" y1="164" x2="716" y2="480" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
<rect x="760" y="236" width="500" height="142" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1010.0" y="262" font-size="13.5" font-weight="bold" fill="#c0392b" text-anchor="middle">⑤ 内部逐结构替换（per-op，当前主链）</text>
<text x="770" y="282" font-size="12" font-weight="normal" fill="#444" text-anchor="start">NPU_SiglipVisionEmbeddings → conv2d_patch_embed_run_die ×1</text>
<text x="770" y="299" font-size="12" font-weight="normal" fill="#444" text-anchor="start">NPU_SiglipAttention → gemm_bias(QKV/O) +</text>
<text x="770" y="316" font-size="12" font-weight="normal" fill="#444" text-anchor="start">  unified_mha_run_die_batch_emb ×27（=27 层铁证）</text>
<text x="770" y="333" font-size="12" font-weight="normal" fill="#444" text-anchor="start">NPU_SiglipMLP → mlp_gelu_run_die（ffi 带 residual_enabled）</text>
<text x="770" y="350" font-size="12" font-weight="normal" fill="#444" text-anchor="start">+ layernorm_buf / residual_add_buf / post_layernorm</text>
<text x="770" y="367" font-size="12" font-weight="normal" fill="#444" text-anchor="start">版本契约：transformers 4.51.3（09 章 T0 静默失效框架）</text>
<line x1="752" y1="308" x2="716" y2="496" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
<rect x="760" y="390" width="500" height="91" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1010.0" y="416" font-size="13.5" font-weight="bold" fill="#1e8449" text-anchor="middle">另一条路：整层融合（groot_ops 已导出）</text>
<text x="770" y="436" font-size="12" font-weight="normal" fill="#444" text-anchor="start">siglip_layer_ffi_fused：LN1+QKV+MHA+out_proj+LN2+MLP 一次调用</text>
<text x="770" y="453" font-size="12" font-weight="normal" fill="#444" text-anchor="start">硬约束：fp16-only / N==out_n / HEADS*D==N / 单 die</text>
<text x="770" y="470" font-size="12" font-weight="normal" fill="#444" text-anchor="start">当前 N1.5 主链未启用：热轮 trace 中出现 0 次（§5）</text>
<line x1="752" y1="441" x2="716" y2="526" stroke="#1e8449" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
<rect x="760" y="493" width="500" height="91" rx="8" fill="#f2f2f2" stroke="#888" stroke-width="1.6"/>
<text x="1010.0" y="519" font-size="13.5" font-weight="bold" fill="#555" text-anchor="middle">开关与探针（§7）</text>
<text x="770" y="539" font-size="12" font-weight="normal" fill="#444" text-anchor="start">GROOT_NPU_QV_TRANSPOSE：unified_mha_forward ↔ _qv_T 两布局</text>
<text x="770" y="556" font-size="12" font-weight="normal" fill="#444" text-anchor="start">NPU_DUMP_SIGLIP：中间激活落 /tmp/npu_*.npy（默认关）</text>
<text x="770" y="573" font-size="12" font-weight="normal" fill="#444" text-anchor="start">golden 对账：deployment_scripts/npu/npu_golden_gate.sh</text>
<text x="650.0" y="860" font-size="12" font-weight="normal" fill="#777" text-anchor="middle">trace 计数 = trace_current_clean/n15_sd3_chrome_trace.json 单轮 infer（09 章 §10.6 CUR 热轮口径）</text>
</svg>
