<text x="56" y="601" font-size="13.5" font-weight="bold" fill="#222" text-anchor="start">怎么读这张图：</text>
<text x="56" y="623" font-size="12" font-weight="normal" fill="#222" text-anchor="start">· 左→中：npu/siglip.py 的三个 NPU_* 类 + encoder_layer_forward_wrapper 逐个结构换 kernel（per-op，发射次数≈结构数）；「共享核」的计数不能整除 27，因为 LM/DiT 也用同名 kernel（09 章纪律：名+@op 归组、trace 为准）。</text>
<text x="56" y="645" font-size="12" font-weight="normal" fill="#222" text-anchor="start">· 中→右：siglip_attn_ffi_fused / siglip_layer_ffi_fused（fused_mha_out_ffi.cc :319/:472）把整层折成 1~2 次发射——N1.5 主链 trace 中出现 0 次；n1.6 线板测 3-cam 视觉塔 fused 0.082 s vs per-op 0.133 s（cos 0.999984，出处见 §6）。</text>
<text x="56" y="667" font-size="12" font-weight="normal" fill="#222" text-anchor="start">· 塔尾另有 post_layernorm（vision_transformer_forward_wrapper 的 NPU 调用点）；mlp1(1152→2048) 不在 SigLIP 融合算子清单内。</text>
</svg>
