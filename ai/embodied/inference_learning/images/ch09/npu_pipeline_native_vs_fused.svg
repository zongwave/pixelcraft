<text x="845" y="1060" font-size="13" font-weight="normal" fill="#145a32" text-anchor="start">e2e 0.826 → 0.697（v0.1）→ 0.14 s 稳态（−83%，5.9×）　·　device busy 51%（87/171ms）</text>
<text x="845" y="1085" font-size="13" font-weight="normal" fill="#145a32" text-anchor="start">融合算子主导：adaln_qkv / fused_mha_out / mlp_gelu_norm / mlp_swiglu / dit_action_head|tail</text>
<text x="845" y="1110" font-size="13" font-weight="normal" fill="#145a32" text-anchor="start">golden 比对 cos 0.99999+（n1.6 达 0.9999999，逐位一致验证）</text>
