<text x="70" y="849" font-size="12.5" font-weight="normal" fill="#333" text-anchor="start">粒度跃迁与发射账见 dit_fusion_granularity.svg（图 9-4）；kernel 的硬形状校验写在 dit_block_ffi.cc:205-225（错即 TVM_FFI_THROW，不静默算错）。</text>
<rect x="30" y="912" width="1500" height="96" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="46" y="933" font-size="12.5" font-weight="normal" fill="#8e2b21" text-anchor="start">三条红线（任一违反都不报错，只是慢或算错）：</text>
<text x="46" y="952" font-size="12.5" font-weight="normal" fill="#8e2b21" text-anchor="start">① 时序：install() 必须早于 from_pretrained()——晚一步类被换了、实例没换，静默走原生路径。</text>
<text x="46" y="971" font-size="12.5" font-weight="normal" fill="#8e2b21" text-anchor="start">② dtype：主链 fp16 不是审美选择——bf16 下设备端 split0↔split1 互转不可用（evo_lpu.py:12-15），bf16 只在最外边界与模型对齐。</text>
<text x="46" y="990" font-size="12.5" font-weight="normal" fill="#8e2b21" text-anchor="start">③ 布局：单 Die 必须用 INIT_SINGLE_DIE 初始化，否则 plain 布局直接出垃圾（docs/records/gr00t_npu_precision_localization.md §20）。</text>
