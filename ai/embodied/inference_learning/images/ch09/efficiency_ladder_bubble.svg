<rect x="36.0" y="800.0" width="1628.0" height="210.0" rx="6" fill="#f7fbff" stroke="#9ec5e8" stroke-width="1.5"/>
<text x="56.0" y="826.0" font-size="15" font-weight="bold" fill="#1a5276" text-anchor="start">三句结论（对应 §10.7）</text>
<text x="56.0" y="844.0" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">① 算力不是瓶颈，形状才是。</text>
<text x="56.0" y="863.0" font-size="12.3" font-weight="normal" fill="#333" text-anchor="start">阶梯顶 63.6（SigLIP MLP，M=768）→ 阶梯底 1.2（Qwen3 attention），跨 54 倍。全轮有用算力 1.33 TFLOP，按阶梯顶折算只要 21.0 ms，而 busy 已经花掉 80.0 ms</text>
<text x="56.0" y="881.0" font-size="12.3" font-weight="normal" fill="#333" text-anchor="start">⇒ busy 里只有 26% 不是空转。DiT 全部条目压在 1–10 TFLOPS：M=49 行、head_dim 48，tile 天生打不满（06 章 §6.8.6 的维度账，在这里变成钱）。</text>
<text x="56.0" y="900.0" font-size="13" font-weight="bold" fill="#1f618d" text-anchor="start">② 墙钟的大头不在 kernel 里。</text>
<text x="56.0" y="919.0" font-size="12.3" font-weight="normal" fill="#333" text-anchor="start">148.7 ms 中 60.9 ms 是相内气泡、7.8 ms 是相外空隙；DiT 四步 span 83.5 ms（墙钟 56%）却只有 32.9 ms 是 busy ⇒ 动作头的账记在发射侧，不记在算力侧</text>
<text x="56.0" y="937.0" font-size="12.3" font-weight="normal" fill="#333" text-anchor="start">旁证：616 次 evLaunchKernel 花 19.8 ms host（32 µs/发 = 墙钟的 13%）；617 发 kernel 里 219 发 &lt;50 µs、70 发 &lt;20 µs；§9 那次 −6.8 ms/step 的 KV 缓存 e2e 归零，就是这个机制造成的。</text>
<text x="56.0" y="956.0" font-size="13" font-weight="bold" fill="#6c3483" text-anchor="start">③ 所以 KPI 是这两个数，不是 FLOPS。</text>
<text x="56.0" y="975.0" font-size="12.3" font-weight="normal" fill="#333" text-anchor="start">每轮发射次数（617 kernel / 616 launch）与常驻字节数。已兑现的最大一笔正是这条：布局契约统一后 KernelCloneTranspose 136 发 134.6 ms → 0 发、</text>
<text x="56.0" y="993.0" font-size="12.3" font-weight="normal" fill="#333" text-anchor="start">750 次 memcpy 174 ms → 23 次 147 µs（两份 trace 对账见 §10.7.3）；融合只是这条路的载体，不是收益本身。</text>
