<text x="830.0" y="209.0" font-size="12.5" font-weight="normal" fill="#1565c0" text-anchor="start">BF16 稠密  119.5 TF</text>
<text x="1160.0" y="209.0" font-size="12.5" font-weight="normal" fill="#1565c0" text-anchor="start">BF16  256 TF（实测 255.9，99.97%）</text>
