<text x="870.0" y="710.0" font-size="13" font-weight="bold" fill="#c62828" text-anchor="start">砍发射/往返</text>
<text x="1040.0" y="710.0" font-size="12" font-weight="normal" fill="#444" text-anchor="start">整块融合(960→64 发射)、权重/KV 常驻、去 page_kv</text>
<rect x="830.0" y="738.0" width="26.0" height="26.0" rx="13" fill="#e65100"/>
<text x="843.0" y="756.0" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="870.0" y="750.0" font-size="13" font-weight="bold" fill="#e65100" text-anchor="start">吃满双 Die</text>
<text x="1040.0" y="750.0" font-size="12" font-weight="normal" fill="#444" text-anchor="start">K/N 切分算子已在库；设备时间 ~60ms ⇒ e2e ~0.07s</text>
<rect x="830.0" y="778.0" width="26.0" height="26.0" rx="13" fill="#2e7d32"/>
<text x="843.0" y="796.0" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="870.0" y="790.0" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="start">最后才砍算力</text>
<text x="1040.0" y="790.0" font-size="12" font-weight="normal" fill="#444" text-anchor="start">INT8 512TOPS=2× 红利；但 left_hand cos 0.992 ⇒ 逐通道验证</text>
<rect x="830.0" y="824.0" width="640.0" height="54.0" rx="6" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.4"/>
<text x="846.0" y="846.0" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="start">反证实验：KV-cache 省 90 GFLOP、设备 −6.8 ms/step，e2e 纹丝不动(0.113 vs 0.114)</text>
<text x="846.0" y="866.0" font-size="12.5" font-weight="normal" fill="#1b5e20" text-anchor="start">⇒ 发射 bound 的系统里先砍算力=白砍；往返清零后这些收益会一次性兑现。</text>
<text x="780.0" y="1034.0" font-size="11.5" font-weight="normal" fill="#888" text-anchor="middle">来源：L20 nvml+本地基准(20·去3warmup) · E200 ev-qual/ev-smi 实查 + groot_ops CHANGELOG v0.1–v0.2-fix · 单Die口径已标注</text>
