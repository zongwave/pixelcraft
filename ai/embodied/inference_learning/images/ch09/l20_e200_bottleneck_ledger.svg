<text x="830.0" y="668.0" font-size="12" font-weight="normal" fill="#6a1b9a" text-anchor="start">to_lpu 累计 6148ms、page_kv 1691ms；FFI 单次固定成本 60–150 µs（GPU launch ~5 µs）</text>
<rect x="830.0" y="698.0" width="26.0" height="26.0" rx="13" fill="#c62828"/>
