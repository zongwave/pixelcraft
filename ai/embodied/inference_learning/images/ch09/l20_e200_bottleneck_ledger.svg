<text x="830.0" y="610.0" font-size="12.5" font-weight="bold" fill="#222" text-anchor="start">E200 v0.2 0.140 s 分解</text>
<rect x="830.0" y="618.0" width="173.4" height="26.0" rx="3" fill="#66bb6a"/>
