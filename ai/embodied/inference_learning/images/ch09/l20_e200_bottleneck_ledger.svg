<text x="90.0" y="693.0" font-size="12.5" font-weight="normal" fill="#795548" text-anchor="start">读法：两条 0.1s 级蓝/绿条贴在一起 —— 半张 E200 ≈ 整张 L20-TRT；而它们离灰色物理下限都还有 ~10×。</text>
