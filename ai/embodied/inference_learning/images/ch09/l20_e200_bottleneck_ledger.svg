<text x="1160.0" y="241.0" font-size="12.5" font-weight="normal" fill="#1565c0" text-anchor="start">INT8  512 TOPS · INT4 1024</text>
<text x="830.0" y="273.0" font-size="12.5" font-weight="normal" fill="#2e7d32" text-anchor="start">GDDR6 864 GB/s</text>
<text x="1160.0" y="273.0" font-size="12.5" font-weight="normal" fill="#2e7d32" text-anchor="start">DDR 理论 960 / 实测读771·写747 GB/s</text>
<text x="830.0" y="305.0" font-size="12.5" font-weight="normal" fill="#2e7d32" text-anchor="start">PCIe Gen4 x16 · 350W</text>
<text x="1160.0" y="305.0" font-size="12.5" font-weight="normal" fill="#2e7d32" text-anchor="start">PCIe Gen5 x16 + 16×XLink · 边缘功耗档</text>
<text x="830.0" y="337.0" font-size="12.5" font-weight="normal" fill="#555" text-anchor="start">L2 96 MB</text>
<text x="1160.0" y="337.0" font-size="12.5" font-weight="normal" fill="#555" text-anchor="start">L1 56MB(AM8+MM48) + L2 72MB</text>
<text x="830.0" y="369.0" font-size="12.5" font-weight="normal" fill="#e65100" text-anchor="start">算力/带宽 138 FLOP/B</text>
<text x="1160.0" y="369.0" font-size="12.5" font-weight="normal" fill="#e65100" text-anchor="start">算力/带宽 267 FLOP/B —— 更挑食</text>
<text x="820.0" y="385.0" font-size="11.5" font-weight="normal" fill="#888" text-anchor="start">注：E200 规格为 ev-qual 整卡口径（block_num 2）；gr00t 当前仅用单 Die。</text>
